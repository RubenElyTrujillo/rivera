name: Rivera CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      # --- SECCIÓN DE DEBUG ---
      - name: Validar si los Secrets existen
        run: |
          echo "Verificando secretos en Repository Secrets..."
          if [ -z "${{ secrets.DOCKER_HUB_USERNAME }}" ]; then echo "❌ DOCKER_HUB_USERNAME no encontrado"; else echo "✅ DOCKER_HUB_USERNAME cargado"; fi
          if [ -z "${{ secrets.DOCKER_HUB_TOKEN }}" ];    then echo "❌ DOCKER_HUB_TOKEN no encontrado";    else echo "✅ DOCKER_HUB_TOKEN cargado"; fi
          if [ -z "${{ secrets.SERVER_IP }}" ];          then echo "❌ SERVER_IP no encontrado";          else echo "✅ SERVER_IP cargado"; fi
      # ------------------------

      - name: Login en Docker Hub
        if: success() # Solo corre si los pasos anteriores no fallaron
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/rivera_web:latest
          cache-from: type=gha
          cache-to: type=inline
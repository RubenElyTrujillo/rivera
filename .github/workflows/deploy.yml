name: Rivera CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Construir y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/rivera_web:latest
          cache-from: type=gha
          cache-to: type=inline

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Crear red si no existe
            docker network create app-network 2>/dev/null || true

            # 2. Levantar PostgreSQL si no está corriendo
            if ! docker ps --format '{{.Names}}' | grep -q '^rivera_postgres$'; then
              docker rm -f rivera_postgres 2>/dev/null || true
              docker run -d \
                --name rivera_postgres \
                --restart unless-stopped \
                --network app-network \
                -e POSTGRES_DB=rivera \
                -e POSTGRES_USER=rivera \
                -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
                -v rivera_postgres_data:/var/lib/postgresql/data \
                postgres:16-alpine
              echo "Esperando a que PostgreSQL esté listo..."
              sleep 8
            fi

            # 3. Bajar la imagen nueva
            docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/rivera_web:latest

            # 4. Detener el contenedor anterior
            docker stop rivera_web 2>/dev/null || true
            docker rm rivera_web 2>/dev/null || true

            # 5. Crear volumen de uploads si no existe
            docker volume create rivera_uploads 2>/dev/null || true

            # 6. Correr el nuevo contenedor
            docker run -d \
              --name rivera_web \
              --restart unless-stopped \
              --network app-network \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
              -e ADMIN_EMAIL="${{ secrets.ADMIN_EMAIL }}" \
              -e ADMIN_PASSWORD="${{ secrets.ADMIN_PASSWORD }}" \
              -e NODE_ENV=production \
              -v rivera_uploads:/app/public/uploads \
              ${{ secrets.DOCKER_HUB_USERNAME }}/rivera_web:latest

            # 7. Limpiar imágenes antiguas
            docker image prune -f

services:
  postgres:
    image: postgres:16-alpine
    container_name: rivera_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rivera}
      POSTGRES_USER: ${POSTGRES_USER:-rivera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rivera} -d ${POSTGRES_DB:-rivera}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    container_name: rivera_web
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      - web_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  web_uploads:

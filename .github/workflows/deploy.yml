name: Rivera CI/CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y subir imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/rivera_web:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en VPS vía SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Asegurar que la red existe
            docker network create app-network 2>/dev/null || true

            # 2. Asegurar que Nginx esté en la red (Vital para quitar el 502)
            docker network connect app-network nginx-app-1 2>/dev/null || true

            # 3. Levantar PostgreSQL si no está (con contraseña del Secret)
            if ! docker ps -a --format '{{.Names}}' | grep -q '^rivera_postgres$'; then
              docker run -d \
                --name rivera_postgres \
                --restart unless-stopped \
                --network app-network \
                -e POSTGRES_DB=rivera \
                -e POSTGRES_USER=rivera \
                -e POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" \
                -v rivera_postgres_data:/var/lib/postgresql/data \
                postgres:16-alpine
            fi

            # Esperar a que PostgreSQL acepte conexiones (máx 60s)
            echo "Esperando a que PostgreSQL esté listo..."
            for i in $(seq 1 20); do
              if docker exec rivera_postgres pg_isready -U rivera -d rivera -q; then
                echo "PostgreSQL listo."
                break
              fi
              echo "  intento $i/20..."
              sleep 3
            done

            # 4. Limpiar versiones viejas de la web
            docker stop rivera_web 2>/dev/null || true
            docker rm rivera_web 2>/dev/null || true

            # 5. Correr la nueva versión con HOSTNAME 0.0.0.0
            docker run -d \
              --name rivera_web \
              --restart unless-stopped \
              --network app-network \
              -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
              -e NEXTAUTH_SECRET="${{ secrets.NEXTAUTH_SECRET }}" \
              -e HOSTNAME="0.0.0.0" \
              -e PORT=3000 \
              -v rivera_uploads:/app/public/uploads \
              5h0k3r/rivera_web:latest

            # 6. Limpieza de imágenes huérfanas
            docker image prune -f